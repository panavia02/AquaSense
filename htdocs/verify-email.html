<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Verify Email - quaSense</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="login">
		<div class="login-box">
			<div class="login-header">quaSense</div>
			<p id="verify-message">Verifying your email...</p>
			<a href="index.html" id="verify-login-link" class="login-secondary-link" style="display:none">Go to login</a>
		</div>
	</div>

	<script>
		(async function () {
			const params = new URLSearchParams(window.location.search);
			const selector = params.get('selector');
			const validator = params.get('validator');
			const messageEl = document.getElementById('verify-message');
			const linkEl = document.getElementById('verify-login-link');

			if (!selector || !validator) {
				messageEl.textContent = 'This verification link is missing information. Please use the link from your email exactly as sent.';
				linkEl.style.display = '';
				return;
			}

			try {
				const body = new URLSearchParams();
				body.set('action', 'verify_email');
				body.set('selector', selector);
				body.set('validator', validator);
				const res = await fetch('auth.php', { method: 'POST', body });
				const json = await res.json();

				if (json.success) {
					messageEl.textContent = json.data.message;
				} else {
					messageEl.textContent = json.error || 'Verification failed.';
				}
			} catch (err) {
				messageEl.textContent = 'Could not reach the server. Please try again shortly.';
			}
			linkEl.style.display = '';
		})();
	</script>
</body>
</html>
