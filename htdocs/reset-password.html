<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reset Password - quaSense</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="login">
		<div class="login-box">
			<div class="login-header">Reset password</div>
			<form id="reset-form">
				<input type="password" id="reset-password" placeholder="New password (min 8 chars)" minlength="8" required />
				<input type="password" id="reset-password-confirm" placeholder="Confirm new password" minlength="8" required />
				<button type="submit">Set new password</button>
				<p class="login-error" id="reset-error" style="display:none"></p>
				<p class="login-success" id="reset-success" style="display:none"></p>
			</form>
			<a href="index.html" id="reset-login-link" class="login-secondary-link" style="display:none">Go to login</a>
		</div>
	</div>

	<script>
		(function () {
			const params = new URLSearchParams(window.location.search);
			const selector = params.get('selector');
			const validator = params.get('validator');
			const form = document.getElementById('reset-form');
			const errorEl = document.getElementById('reset-error');
			const successEl = document.getElementById('reset-success');
			const loginLink = document.getElementById('reset-login-link');

			if (!selector || !validator) {
				errorEl.textContent = 'This reset link is missing information. Please use the link from your email exactly as sent.';
				errorEl.style.display = '';
				form.style.display = 'none';
				loginLink.style.display = '';
				return;
			}

			form.addEventListener('submit', async (event) => {
				event.preventDefault();
				errorEl.style.display = 'none';
				successEl.style.display = 'none';

				const password = document.getElementById('reset-password').value;
				const confirm = document.getElementById('reset-password-confirm').value;

				if (password !== confirm) {
					errorEl.textContent = "Passwords don't match.";
					errorEl.style.display = '';
					return;
				}

				try {
					const body = new URLSearchParams();
					body.set('action', 'reset_password');
					body.set('selector', selector);
					body.set('validator', validator);
					body.set('new_password', password);
					const res = await fetch('auth.php', { method: 'POST', body });
					const json = await res.json();

					if (json.success) {
						successEl.textContent = json.data.message;
						successEl.style.display = '';
						form.style.display = 'none';
						loginLink.style.display = '';
					} else {
						errorEl.textContent = json.error || 'Reset failed.';
						errorEl.style.display = '';
					}
				} catch (err) {
					errorEl.textContent = 'Could not reach the server. Please try again.';
					errorEl.style.display = '';
				}
			});
		})();
	</script>
</body>
</html>
